<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7EC">
<title>跳绳大转盘</title>
<style>
:root{
  --cream:#FFF7EC; --ink:#4A3B33; --ink2:#7A6558;
  --coral:#FF9E8E; --sun:#FFD36B; --mint:#8FE0BE;
  --sky:#8FCBF2; --lilac:#C9B0F0; --peach:#FFC08A;
  --shadow:0 10px 30px -12px rgba(120,80,50,.35);
  --round:"Yuanti SC","Hiragino Sans GB","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(120% 90% at 50% 0%,#FFFDF8 0%,var(--cream) 55%,#FFEFD9 100%);
  color:var(--ink); font-family:var(--round); overflow-x:hidden;
  display:flex; flex-direction:column; align-items:center;
  padding:22px 16px 26px; min-height:100%; position:relative; justify-content:center;
}

/* 背景装饰 */
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bg i{position:absolute;display:block;border-radius:50%;background:#fff;opacity:.75;filter:blur(.3px)}
.cloud1{width:120px;height:44px;top:9%;left:-30px;box-shadow:34px 6px 0 -6px #fff, 66px -8px 0 -10px #fff;animation:float 9s ease-in-out infinite}
.cloud2{width:86px;height:32px;top:22%;right:-24px;box-shadow:26px 4px 0 -4px #fff;animation:float 11s ease-in-out infinite reverse}
.star{position:absolute;background:none!important;font-size:14px;opacity:.5}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* 头部 */
header{position:relative;z-index:2;text-align:center;margin-bottom:6px}
.mascot{font-size:34px;line-height:1;animation:hop 1.6s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
h1{
  font-size:27px;margin:6px 0 4px;letter-spacing:.08em;color:#5A4335;
  text-shadow:0 2px 0 #fff;
}
.sub{font-size:13px;color:var(--ink2);letter-spacing:.1em;margin:0}

/* 转盘 */
.stage{position:relative;z-index:2;margin-top:30px;width:min(88vw,360px);aspect-ratio:1/1;display:grid;place-items:center}
.pointer{
  position:absolute;top:-26px;left:50%;transform:translateX(-50%);z-index:6;
  width:44px;height:56px;filter:drop-shadow(0 6px 8px rgba(190,100,70,.35));
  transform-origin:50% 10%;
}
.pointer svg{width:100%;height:100%;display:block}
.pointer.tap{animation:tap .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes tap{0%{transform:translateX(-50%) rotate(0)}30%{transform:translateX(-50%) rotate(-14deg)}100%{transform:translateX(-50%) rotate(0)}}

.wheel{width:100%;height:100%;transition:transform 4.9s cubic-bezier(.12,.86,.12,1);will-change:transform;filter:drop-shadow(0 14px 26px rgba(150,100,60,.28))}
.wheel.spinning{transition:transform 4.9s cubic-bezier(.12,.86,.12,1)}
svg{display:block;width:100%;height:100%}

.spin{
  position:absolute;z-index:5;width:27%;aspect-ratio:1/1;border-radius:50%;border:0;cursor:pointer;
  background:linear-gradient(180deg,#FFFFFF,#FFF3E2);
  box-shadow:0 0 0 6px #fff, 0 0 0 9px #FFD9C4, 0 10px 20px -6px rgba(180,110,70,.45);
  font-family:var(--round);font-size:19px;font-weight:800;color:#E2653F;letter-spacing:.08em;
  transition:transform .15s, box-shadow .2s;
}
.spin:active{transform:scale(.94)}
.spin span{display:block;font-size:10px;letter-spacing:.14em;color:#B98A6E;margin-top:2px;font-weight:600}
.spin[disabled]{cursor:default;opacity:.95}

/* 六个选项说明 */
.legend{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px;max-width:400px}
.chip{
  display:flex;align-items:center;gap:5px;font-size:12.5px;padding:6px 11px;border-radius:20px;
  background:#fff;box-shadow:0 3px 10px -6px rgba(150,100,60,.6);color:#5A4B42;letter-spacing:.04em;
}
.chip i{width:9px;height:9px;border-radius:50%;display:block}

footer{position:relative;z-index:2;margin-top:26px;padding-top:4px;font-size:11.5px;color:#A08C7C;letter-spacing:.1em}

/* 结果弹层 */
.result{position:fixed;inset:0;z-index:20;background:rgba(60,42,32,.42);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:22px;animation:fade .25s ease both}
.result[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{
  width:min(92vw,340px);background:#FFFCf6;border-radius:26px;padding:26px 22px 20px;text-align:center;
  box-shadow:0 24px 60px -20px rgba(80,50,30,.55);animation:pop .45s cubic-bezier(.2,1.5,.4,1) both;
  position:relative;overflow:hidden;
}
@keyframes pop{from{transform:scale(.7) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.card::before{content:"";position:absolute;top:-40px;left:-40px;width:120px;height:120px;border-radius:50%;background:#FFF0D8}
.card .em{font-size:46px;position:relative;animation:hop 1.4s ease-in-out infinite}
.card .say{font-size:12.5px;color:#B08A6E;letter-spacing:.14em;margin:2px 0 10px}
.card .task{font-size:34px;font-weight:900;color:#E2653F;letter-spacing:.06em;line-height:1.2;position:relative}
.card .tip{font-size:13.5px;color:#7A6558;margin:12px 0 20px;line-height:1.7;min-height:23px}
.card .row{display:flex;gap:10px;position:relative}
.btn{flex:1;border:0;border-radius:16px;padding:13px 8px;font-family:var(--round);font-size:15px;font-weight:800;cursor:pointer;letter-spacing:.06em;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#FF9E8E,#FF7E6B);color:#fff;box-shadow:0 8px 18px -8px rgba(230,100,70,.9)}
.btn.ghost{background:#F4EADF;color:#8A7264}

/* 撒花 */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;width:9px;height:13px;border-radius:2px;opacity:.95;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}

@media (max-width:360px){ h1{font-size:23px} .chip{font-size:11.5px;padding:5px 9px} }
@media (prefers-reduced-motion:reduce){
  .wheel{transition-duration:1.2s!important}
  .mascot,.card .em{animation:none}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <i class="cloud1"></i><i class="cloud2"></i>
  <span class="star" style="top:30%;left:8%">✦</span>
  <span class="star" style="top:16%;right:12%">✧</span>
  <span class="star" style="top:64%;left:14%">✦</span>
  <span class="star" style="top:74%;right:9%">✧</span>
</div>

<header>
  <div class="mascot">🐰</div>
  <h1>跳绳大转盘</h1>
  <p class="sub">今天跳多少，转一转就知道</p>
</header>

<div class="stage">
  <div class="pointer" id="pointer" aria-hidden="true"><svg viewBox="0 0 44 56" xmlns="http://www.w3.org/2000/svg"><path d="M22 4 C 12 4 5 11 5 21 C 5 33 22 52 22 52 C 22 52 39 33 39 21 C 39 11 32 4 22 4 Z" fill="#FF8B76" stroke="#FFFFFF" stroke-width="5"/><circle cx="22" cy="21" r="6.5" fill="#FFFFFF" opacity=".95"/></svg></div>
  <div class="wheel" id="wheel"></div>
  <button class="spin" id="spin" type="button">转！<span>点一下</span></button>
</div>

<div class="legend" id="legend"></div>

<footer>每天转一次，转完就跳 · 不许耍赖哦</footer>

<div class="result" id="result" hidden>
  <div class="card">
    <div class="em" id="r-em">💪</div>
    <div class="say" id="r-say">今天就这个啦</div>
    <div class="task" id="r-task">跳 100 个</div>
    <div class="tip" id="r-tip">小兔子说：你可以的！</div>
    <div class="row">
      <button class="btn primary" id="r-go" type="button">开始跳！</button>
      <button class="btn ghost" id="r-again" type="button">再转一次</button>
    </div>
  </div>
</div>

<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
/* ---------------- 六个选项 ---------------- */
var SEG = [
  { task:'跳 100 个', short:'100 个', color:'#FF9E8E', em:'💪', tips:['小兔子说：你可以的！','稳稳地跳，一下就过去了。'] },
  { task:'跳 120 个', short:'120 个', color:'#FFD36B', em:'⚡', tips:['今天的你有点猛！','分成 60 + 60 也行哦。'] },
  { task:'跳 80 个',   short:'80 个',  color:'#8FE0BE', em:'🌿', tips:['轻松局，热热身。','跳完记得喝口水。'] },
  { task:'跳 45 秒',   short:'45 秒',  color:'#8FCBF2', em:'⏱', tips:['争分夺秒，加油！','数一数这 45 秒你能跳几个？'] },
  { task:'跳 50 秒',   short:'50 秒',  color:'#C9B0F0', em:'🎵', tips:['跟着节奏，一下一下。','慢一点也完全没问题。'] },
  { task:'50 + 50 个', short:'50+50',  color:'#FFC08A', em:'🔁', tips:['分两组，中间歇 30 秒。','两口气跳完，很棒！'] }
];

/* ---------------- 画转盘 ---------------- */
var wheel = document.getElementById('wheel');
var R = 168, C = 180, N = SEG.length, STEP = 360 / N;

function polar(a, r){           // a: 从正上方顺时针的度数
  var rad = (a - 90) * Math.PI / 180;
  return [C + r * Math.cos(rad), C + r * Math.sin(rad)];
}
function sectorPath(i){
  var a0 = i * STEP, a1 = a0 + STEP;
  var p0 = polar(a0, R), p1 = polar(a1, R);
  var large = STEP > 180 ? 1 : 0;
  return 'M' + C + ' ' + C + ' L' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) +
         ' A' + R + ' ' + R + ' 0 ' + large + ' 1 ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) + ' Z';
}

var svg = '<svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">';
svg += '<circle cx="180" cy="180" r="174" fill="#FFFFFF"/>';
svg += '<circle cx="180" cy="180" r="174" fill="none" stroke="#FFD9C4" stroke-width="6"/>';

SEG.forEach(function(s, i){
  svg += '<path d="' + sectorPath(i) + '" fill="' + s.color + '" stroke="#FFFFFF" stroke-width="3"/>';
});

// 标签（水平摆放，静止时最易读）
SEG.forEach(function(s, i){
  var mid = i * STEP + STEP / 2;
  var pt = polar(mid, R * 0.63);
  svg += '<g transform="translate(' + pt[0].toFixed(1) + ',' + pt[1].toFixed(1) + ')">' +
         '<text x="0" y="-2" text-anchor="middle" font-family="inherit" font-size="19" font-weight="800" fill="#4A3B33">' + s.short + '</text>' +
         '<text x="0" y="15" text-anchor="middle" font-family="inherit" font-size="10" font-weight="700" fill="#6B574B" opacity=".75">' + (s.task.indexOf('秒') > -1 ? '计时' : '个数') + '</text>' +
         '</g>';
});

svg += '<circle cx="180" cy="180" r="46" fill="#FFFFFF" opacity=".92"/>';
svg += '</svg>';
wheel.innerHTML = svg;

/* 图例 */
document.getElementById('legend').innerHTML = SEG.map(function(s){
  return '<span class="chip"><i style="background:' + s.color + '"></i>' + s.task + '</span>';
}).join('');

/* ---------------- 转动逻辑 ---------------- */
var spinBtn = document.getElementById('spin');
var pointer = document.getElementById('pointer');
var result = document.getElementById('result');
var rot = 0, spinning = false, lastIndex = -1;

function spin(){
  if (spinning) return;
  spinning = true;
  spinBtn.disabled = true;

  var idx = Math.floor(Math.random() * N);
  var jitter = (Math.random() * 40 - 20);
  var targetMod = (360 - (idx * STEP + STEP / 2) + jitter + 360) % 360;
  var delta = ((targetMod - (rot % 360)) + 360) % 360 + 360 * 6;
  rot += delta;

  result.hidden = true;
  wheel.style.transform = 'rotate(' + rot + 'deg)';
  pointer.classList.remove('tap');

  setTimeout(function(){
    spinBtn.disabled = false;
    spinning = false;
    pointer.classList.add('tap');
    showResult(idx);
    confetti();
    vibrate();
  }, 5000);
}

function showResult(i){
  var s = SEG[i];
  document.getElementById('r-em').textContent = s.em;
  document.getElementById('r-task').textContent = s.task;
  document.getElementById('r-tip').textContent = s.tips[Math.floor(Math.random() * s.tips.length)];
  document.getElementById('r-say').textContent = '指针停在 ——';
  result.hidden = false;
}

function confetti(){
  var box = document.getElementById('confetti');
  var colors = ['#FF9E8E','#FFD36B','#8FE0BE','#8FCBF2','#C9B0F0','#FFC08A'];
  for (var k = 0; k < 42; k++){
    var el = document.createElement('i');
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = '-20px';
    el.style.background = colors[k % colors.length];
    el.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
    el.style.animationDelay = (Math.random() * .35) + 's';
    el.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
    box.appendChild(el);
    setTimeout(function(e){ return function(){ e.remove(); }; }(el), 3400);
  }
}
function vibrate(){ try { if (navigator.vibrate) navigator.vibrate([12, 60, 22]); } catch(e){} }

spinBtn.addEventListener('click', spin);
wheel.addEventListener('click', spin);
document.getElementById('r-go').addEventListener('click', function(){
  result.hidden = true;
  document.body.animate([{transform:'scale(1)'},{transform:'scale(1.01)'},{transform:'scale(1)'}], {duration:260});
});
document.getElementById('r-again').addEventListener('click', function(){
  result.hidden = true;
  setTimeout(spin, 180);
});
document.addEventListener('keydown', function(e){
  if (e.code === 'Space'){ e.preventDefault(); if (!result.hidden) return; spin(); }
});
</script>
</body>
</html>
