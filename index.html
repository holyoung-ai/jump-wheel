<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7EC">
<title>跳绳大转盘 · 每天六组</title>
<style>
:root{
  --cream:#FFF7EC; --ink:#4A3B33; --ink2:#7A6558;
  --coral:#FF9E8E; --sun:#FFD36B; --mint:#8FE0BE;
  --sky:#8FCBF2; --lilac:#C9B0F0; --peach:#FFC08A;
  --round:"Yuanti SC","Hiragino Sans GB","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(120% 90% at 50% 0%,#FFFDF8 0%,var(--cream) 55%,#FFEFD9 100%);
  color:var(--ink); font-family:var(--round); overflow-x:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:20px 16px 24px; position:relative;
}

.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bg i{position:absolute;display:block;border-radius:50%;background:#fff;opacity:.75;filter:blur(.3px)}
.cloud1{width:120px;height:44px;top:9%;left:-30px;box-shadow:34px 6px 0 -6px #fff,66px -8px 0 -10px #fff;animation:float 9s ease-in-out infinite}
.cloud2{width:86px;height:32px;top:22%;right:-24px;box-shadow:26px 4px 0 -4px #fff;animation:float 11s ease-in-out infinite reverse}
.star{position:absolute;background:none!important;font-size:14px;opacity:.5}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

header{position:relative;z-index:2;text-align:center}
.mascot{font-size:30px;line-height:1;animation:hop 1.6s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
h1{font-size:25px;margin:4px 0 3px;letter-spacing:.08em;color:#5A4335;text-shadow:0 2px 0 #fff}
.sub{font-size:12.5px;color:var(--ink2);letter-spacing:.1em;margin:0}

/* 今日进度 */
.today{position:relative;z-index:2;margin-top:14px;display:flex;align-items:center;gap:10px;
  background:#fff;border-radius:26px;padding:7px 14px;box-shadow:0 6px 16px -10px rgba(160,110,70,.55)}
.today .lbl{font-size:11px;letter-spacing:.14em;color:#A08C7C}
.slots{display:flex;gap:6px}
.slot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  font-size:9.5px;font-weight:800;letter-spacing:0;border:2px dashed #EADCCB;color:#C7B6A4;
  transition:all .3s cubic-bezier(.2,1.4,.4,1)}
.slot.filled{border:2px solid transparent;color:#4A3B33;transform:scale(1.04)}
.slot.now{border:2px solid #FFB59A;color:#E2653F;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,150,120,.5)}50%{box-shadow:0 0 0 7px rgba(255,150,120,0)}}
.today .cnt{font-size:12px;font-weight:800;color:#E2653F;letter-spacing:.04em}

/* 完成横幅 */
.done{position:relative;z-index:2;margin-top:12px;background:#FFF3E0;border:2px dashed #FFC59E;
  border-radius:18px;padding:12px 16px;text-align:center;font-size:13px;color:#8A5A3E;line-height:1.7}
.done b{color:#E2653F;font-size:15px}
.done[hidden]{display:none}

/* 转盘 */
.stage{position:relative;z-index:2;margin-top:22px;width:min(86vw,350px);aspect-ratio:1/1;display:grid;place-items:center}
.pointer{position:absolute;top:-26px;left:50%;transform:translateX(-50%);z-index:6;width:44px;height:56px;
  filter:drop-shadow(0 6px 8px rgba(190,100,70,.35));transform-origin:50% 10%}
.pointer svg{width:100%;height:100%;display:block}
.pointer.tap{animation:tap .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes tap{0%{transform:translateX(-50%) rotate(0)}30%{transform:translateX(-50%) rotate(-14deg)}100%{transform:translateX(-50%) rotate(0)}}

.wheel{width:100%;height:100%;transition:transform 4.9s cubic-bezier(.12,.86,.12,1);will-change:transform;
  filter:drop-shadow(0 14px 26px rgba(150,100,60,.28))}
svg{display:block;width:100%;height:100%}

.spin{position:absolute;z-index:5;width:27%;aspect-ratio:1/1;border-radius:50%;border:0;cursor:pointer;
  background:linear-gradient(180deg,#FFFFFF,#FFF3E2);
  box-shadow:0 0 0 6px #fff,0 0 0 9px #FFD9C4,0 10px 20px -6px rgba(180,110,70,.45);
  font-family:var(--round);font-size:19px;font-weight:800;color:#E2653F;letter-spacing:.08em;
  transition:transform .15s;line-height:1.15}
.spin:active{transform:scale(.94)}
.spin span{display:block;font-size:9.5px;letter-spacing:.1em;color:#B98A6E;margin-top:3px;font-weight:700}
.spin[disabled]{cursor:default;color:#C0AA99}
.spin[disabled] span{color:#C0AA99}

.legend{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:18px;max-width:400px}
.chip{display:flex;align-items:center;gap:5px;font-size:12px;padding:5px 10px;border-radius:20px;
  background:#fff;box-shadow:0 3px 10px -6px rgba(150,100,60,.6);color:#5A4B42}
.chip i{width:8px;height:8px;border-radius:50%;display:block}

footer{position:relative;z-index:2;margin-top:20px;font-size:11px;color:#A08C7C;letter-spacing:.08em;text-align:center;line-height:1.9}
footer button{background:none;border:0;color:#B9A491;font-size:10.5px;text-decoration:underline;cursor:pointer;font-family:inherit;padding:2px 6px}

/* 结果弹层 */
.result{position:fixed;inset:0;z-index:20;background:rgba(60,42,32,.42);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:22px;animation:fade .25s ease both}
.result[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{width:min(92vw,340px);background:#FFFCF6;border-radius:26px;padding:24px 22px 20px;text-align:center;
  box-shadow:0 24px 60px -20px rgba(80,50,30,.55);animation:pop .45s cubic-bezier(.2,1.5,.4,1) both;
  position:relative;overflow:hidden}
@keyframes pop{from{transform:scale(.7) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.card::before{content:"";position:absolute;top:-40px;left:-40px;width:120px;height:120px;border-radius:50%;background:#FFF0D8}
.card .round{font-size:11px;letter-spacing:.2em;color:#B08A6E;position:relative}
.card .em{font-size:44px;position:relative;animation:hop 1.4s ease-in-out infinite;margin-top:2px}
.card .task{font-size:33px;font-weight:900;color:#E2653F;letter-spacing:.06em;line-height:1.2;position:relative;margin-top:4px}
.card .tip{font-size:13px;color:#7A6558;margin:10px 0 18px;line-height:1.7;min-height:22px;position:relative}
.card .btn{width:100%;border:0;border-radius:16px;padding:14px 8px;font-family:var(--round);font-size:16px;
  font-weight:800;cursor:pointer;letter-spacing:.06em;transition:transform .12s;
  background:linear-gradient(180deg,#FF9E8E,#FF7E6B);color:#fff;box-shadow:0 8px 18px -8px rgba(230,100,70,.9)}
.card .btn:active{transform:scale(.97)}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;width:9px;height:13px;border-radius:2px;opacity:.95;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}

@media (max-width:360px){
  h1{font-size:22px}
  .slot{width:30px;height:30px;font-size:9.5px}
  .chip{font-size:11px;padding:4px 8px}
}
@media (prefers-reduced-motion:reduce){
  .wheel{transition-duration:1.2s!important}
  .mascot,.card .em,.slot.now{animation:none}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <i class="cloud1"></i><i class="cloud2"></i>
  <span class="star" style="top:30%;left:8%">✦</span>
  <span class="star" style="top:16%;right:12%">✧</span>
  <span class="star" style="top:64%;left:14%">✦</span>
  <span class="star" style="top:74%;right:9%">✧</span>
</div>

<header>
  <div class="mascot">🐰</div>
  <h1>跳绳大转盘</h1>
  <p class="sub">今天跳 6 组，每组转一次</p>
</header>

<div class="today">
  <span class="lbl">今天</span>
  <div class="slots" id="slots"></div>
  <span class="cnt" id="cnt">0 / 6</span>
</div>

<div class="done" id="done" hidden></div>

<div class="stage">
  <div class="pointer" id="pointer" aria-hidden="true">
    <svg viewBox="0 0 44 56" xmlns="http://www.w3.org/2000/svg">
      <path d="M22 4 C 12 4 5 11 5 21 C 5 33 22 52 22 52 C 22 52 39 33 39 21 C 39 11 32 4 22 4 Z" fill="#FF8B76" stroke="#FFFFFF" stroke-width="5"/>
      <circle cx="22" cy="21" r="6.5" fill="#FFFFFF" opacity=".95"/>
    </svg>
  </div>
  <div class="wheel" id="wheel"></div>
  <button class="spin" id="spin" type="button">转！<span id="spin-sub">第 1 组</span></button>
</div>

<div class="legend" id="legend"></div>

<footer>
  一天 6 组，转完就跳 · 谁耍赖谁小狗<br>
  <button type="button" id="reset">清空今天（家长用）</button>
</footer>

<div class="result" id="result" hidden>
  <div class="card">
    <div class="round" id="r-round">第 1 组</div>
    <div class="em" id="r-em">💪</div>
    <div class="task" id="r-task">跳 100 个</div>
    <div class="tip" id="r-tip">小兔子说：你可以的！</div>
    <button class="btn" id="r-go" type="button">去跳！</button>
  </div>
</div>

<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
/* ---------------- 六个选项 ---------------- */
var SEG = [
  { task:'跳 100 个', short:'100', face:'100 个', color:'#FF9E8E', em:'💪', kind:'count', n:100,
    tips:['小兔子说：你可以的！','稳稳地跳，一下就过去了。'] },
  { task:'跳 120 个', short:'120', face:'120 个', color:'#FFD36B', em:'⚡', kind:'count', n:120,
    tips:['今天的你有点猛！','分成 60 + 60 也行哦。'] },
  { task:'跳 80 个', short:'80', face:'80 个', color:'#8FE0BE', em:'🌿', kind:'count', n:80,
    tips:['轻松局，热热身。','跳完记得喝口水。'] },
  { task:'跳 45 秒', short:'45秒', face:'45 秒', color:'#8FCBF2', em:'⏱', kind:'time', s:45,
    tips:['争分夺秒，加油！','数一数这 45 秒你能跳几个？'] },
  { task:'跳 50 秒', short:'50秒', face:'50 秒', color:'#C9B0F0', em:'🎵', kind:'time', s:50,
    tips:['跟着节奏，一下一下。','慢一点也完全没问题。'] },
  { task:'50 + 50 个', short:'50+50', face:'50+50', color:'#FFC08A', em:'🔁', kind:'count', n:100,
    tips:['分两组，中间歇 30 秒。','两口气跳完，很棒！'] }
];
var PER_DAY = 6;

/* ---------------- 画转盘 ---------------- */
var wheel = document.getElementById('wheel');
var R = 168, C = 180, N = SEG.length, STEP = 360 / N;

function polar(a, r){
  var rad = (a - 90) * Math.PI / 180;
  return [C + r * Math.cos(rad), C + r * Math.sin(rad)];
}
function sectorPath(i){
  var a0 = i * STEP, a1 = a0 + STEP;
  var p0 = polar(a0, R), p1 = polar(a1, R);
  return 'M' + C + ' ' + C + ' L' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) +
         ' A' + R + ' ' + R + ' 0 0 1 ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) + ' Z';
}

var svg = '<svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">';
svg += '<circle cx="180" cy="180" r="174" fill="#FFFFFF"/>';
svg += '<circle cx="180" cy="180" r="174" fill="none" stroke="#FFD9C4" stroke-width="6"/>';
SEG.forEach(function(s, i){
  svg += '<path d="' + sectorPath(i) + '" fill="' + s.color + '" stroke="#FFFFFF" stroke-width="3"/>';
});
SEG.forEach(function(s, i){
  var mid = i * STEP + STEP / 2;
  var pt = polar(mid, R * 0.63);
  var fs = (s.face.length >= 5 ? 16 : 19);
  svg += '<g transform="translate(' + pt[0].toFixed(1) + ',' + pt[1].toFixed(1) + ')">' +
         '<text x="0" y="6" text-anchor="middle" font-family="inherit" font-size="' + fs + '" font-weight="800" fill="#4A3B33">' + s.face + '</text>' +
         '</g>';
});
svg += '<circle cx="180" cy="180" r="46" fill="#FFFFFF" opacity=".92"/></svg>';
wheel.innerHTML = svg;

document.getElementById('legend').innerHTML = SEG.map(function(s){
  return '<span class="chip"><i style="background:' + s.color + '"></i>' + s.task + '</span>';
}).join('');

/* ---------------- 今日状态 ---------------- */
var KEY = 'jump-wheel-day-v1';
function todayKey(){
  var d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}
var state = { date: todayKey(), draws: [] };

function load(){
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var o = JSON.parse(raw);
      if (o && o.date === todayKey() && Array.isArray(o.draws)) state = o;
    }
  } catch(e){}
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
}

var slotsEl = document.getElementById('slots');
var cntEl = document.getElementById('cnt');
var spinBtn = document.getElementById('spin');
var spinSub = document.getElementById('spin-sub');
var pointer = document.getElementById('pointer');
var result = document.getElementById('result');
var doneEl = document.getElementById('done');

function remaining(){ return PER_DAY - state.draws.length; }

function render(){
  var left = remaining();
  var html = '';
  for (var i = 0; i < PER_DAY; i++){
    var d = state.draws[i];
    if (d) {
      html += '<span class="slot filled" style="background:' + d.color + '">' + d.short + '</span>';
    } else {
      html += '<span class="slot' + (i === state.draws.length ? ' now' : '') + '">' + (i+1) + '</span>';
    }
  }
  slotsEl.innerHTML = html;
  cntEl.textContent = state.draws.length + ' / ' + PER_DAY;

  if (left <= 0){
    spinBtn.disabled = true;
    spinBtn.firstChild.nodeValue = '完成 🎉';
    spinSub.textContent = '明天再来';
    doneEl.hidden = false;
    doneEl.innerHTML = summary();
  } else {
    spinBtn.disabled = false;
    spinBtn.firstChild.nodeValue = '转！';
    spinSub.textContent = '第 ' + (state.draws.length + 1) + ' 组';
    doneEl.hidden = true;
  }
}

function summary(){
  var cnt = 0, sec = 0;
  state.draws.forEach(function(d){ if (d.kind === 'count') cnt += d.n; else sec += d.s; });
  var parts = [];
  if (cnt) parts.push('<b>' + cnt + '</b> 个');
  if (sec) parts.push('<b>' + sec + '</b> 秒');
  return '今天的 6 组全部完成啦 🎉<br>一共 ' + parts.join(' ＋ ') + '<br>明天再来转新的！';
}

/* ---------------- 转动 ---------------- */
var rot = 0, spinning = false;

function spin(){
  if (spinning || remaining() <= 0) return;
  spinning = true;
  spinBtn.disabled = true;

  var idx = Math.floor(Math.random() * N);
  // 避免连续两次相同，减少“怎么又是它”
  var last = state.draws.length ? state.draws[state.draws.length - 1].idx : -1;
  if (idx === last) idx = (idx + 1 + Math.floor(Math.random() * (N - 1))) % N;

  var jitter = (Math.random() * 40 - 20);
  var targetMod = (360 - (idx * STEP + STEP / 2) + jitter + 360) % 360;
  var delta = ((targetMod - (rot % 360)) + 360) % 360 + 360 * 6;
  rot += delta;

  result.hidden = true;
  wheel.style.transform = 'rotate(' + rot + 'deg)';
  pointer.classList.remove('tap');

  setTimeout(function(){
    spinning = false;
    pointer.classList.add('tap');
    var s = SEG[idx];
    state.draws.push({ idx: idx, short: s.short, task: s.task, color: s.color,
                       kind: s.kind, n: s.n || 0, s: s.s || 0,
                       at: Date.now() });
    save();
    render();
    showResult(idx);
    confetti(state.draws.length === PER_DAY ? 70 : 36);
    vibrate();
  }, 5000);
}

function showResult(i){
  var s = SEG[i];
  document.getElementById('r-round').textContent = '第 ' + state.draws.length + ' 组 / 共 ' + PER_DAY + ' 组';
  document.getElementById('r-em').textContent = s.em;
  document.getElementById('r-task').textContent = s.task;
  document.getElementById('r-tip').textContent = s.tips[Math.floor(Math.random() * s.tips.length)];
  document.getElementById('r-go').textContent = state.draws.length === PER_DAY ? '完成今天 🎉' : '去跳！';
  result.hidden = false;
}

function confetti(n){
  var box = document.getElementById('confetti');
  var colors = ['#FF9E8E','#FFD36B','#8FE0BE','#8FCBF2','#C9B0F0','#FFC08A'];
  for (var k = 0; k < n; k++){
    var el = document.createElement('i');
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = '-20px';
    el.style.background = colors[k % colors.length];
    el.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
    el.style.animationDelay = (Math.random() * .35) + 's';
    el.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
    box.appendChild(el);
    setTimeout(function(e){ return function(){ e.remove(); }; }(el), 3400);
  }
}
function vibrate(){ try { if (navigator.vibrate) navigator.vibrate([12, 60, 22]); } catch(e){} }

spinBtn.addEventListener('click', spin);
wheel.addEventListener('click', spin);
document.getElementById('r-go').addEventListener('click', function(){ result.hidden = true; });
document.addEventListener('keydown', function(e){
  if (e.code === 'Space'){ e.preventDefault(); if (!result.hidden) return; spin(); }
});
document.getElementById('reset').addEventListener('click', function(){
  if (confirm('确定清空今天的记录吗？（给家长调试用）')){
    state = { date: todayKey(), draws: [] };
    save(); render();
  }
});

load();
render();
</script>
</body>
</html>
